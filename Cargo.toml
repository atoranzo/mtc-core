[package]
name = "mtc-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Angel Toranzo Portela"]
description = "Backend de una CA de Merkle Tree Certificates (draft-ietf-plants-merkle-tree-certs): log de emision, subarboles, pruebas de inclusion y cofirmas PQC. Semilla del fork de Arqueo sin STARK."
publish = false

# ⚠️ WORKSPACE PROPIO. Este crate NO es miembro del workspace de Arqueo:
# la tabla vacia de abajo lo convierte en raiz de su propio workspace, con
# su propio `Cargo.lock`. Razones, las dos medidas:
#   - `tools/canon.sh` enumera los miembros del `Cargo.toml` raiz y el
#     canon cuenta 21 crates; anadir uno cambiaria cifras que las
#     herramientas vigilan.
#   - El `[patch.crates-io]` de la raiz sustituye `winter-*` por el fork
#     (§533). Este crate no debe arrastrar winterfell, ni siquiera por
#     resolucion accidental: aqui no hay campo de Goldilocks, hay SHA-256.
[workspace]

[dependencies]
# El hash del log (RFC 9162 / MTC): SHA-256 nativo. Sustituye a Rescue
# Prime (`zk-ssl-hash::native_merge`), que solo tenia sentido dentro de
# un circuito STARK.
sha2 = "0.10"

# El guardian de estado extraido de `zk-ssl-guardian`: contador monotono
# persistido con fsync, autocomprobacion de tmpfs y reconciliacion. Aqui
# guarda el numero de checkpoint (persistir ANTES de firmar) y, si el
# cofirmante de la CA es XMSS/LMS, el indice de firma. Clavado a un commit.
hbs-state = { git = "https://github.com/atoranzo/hbs-state", rev = "a960828bf0e810c30b49640c9bcb8d64f9c9557f" }

# ML-DSA (FIPS 204). El borrador disena el formato de cofirma para ser
# compatible con la construccion ML-DSA-44 de TLOG-COSIGNATURE. Opcional:
# el nucleo del arbol no depende de ninguna firma concreta.
# ⚠️ Sin auditoria independiente, declarado por el propio crate.
ml-dsa = { version = "0.1.1", optional = true }

[features]
default = ["ml-dsa"]
ml-dsa = ["dep:ml-dsa"]

# El ejemplo firma con ML-DSA: sin la feature no compila, y se declara.
[[example]]
name = "demo_ca"
required-features = ["ml-dsa"]
