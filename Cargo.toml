[package]
name = "mtc-core"
version = "0.1.0"
edition = "2021"
# `u64::is_multiple_of` (1.87) is the newest thing in use.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
authors = ["Angel Toranzo Portela"]
description = "A verified core for a Merkle Tree Certificates CA (draft-ietf-plants-merkle-tree-certs): issuance log, subtrees, inclusion proofs, PQC cosignatures and the relying-party verifier. Extracted from Arqueo, without its STARK layer."
publish = false

# The empty table below makes this crate the root of its own workspace, with
# its own `Cargo.lock`. It was born inside Arqueo's tree, where two things
# made that necessary and both were measured: `tools/canon.sh` enumerates the
# members of Arqueo's root manifest (the canon counts 21 crates), and
# Arqueo's `[patch.crates-io]` replaces `winter-*` with a fork. This crate
# must never drag in winterfell, not even by accidental resolution: there is
# no Goldilocks field here, there is SHA-256. Standalone, the table is
# harmless and stays as a record of that origin.
[workspace]

[dependencies]
# The log hash (RFC 9162 / MTC): native SHA-256. Replaces Rescue Prime
# (`zk-ssl-hash::native_merge`), which only made sense inside a STARK
# circuit.
sha2 = "0.10"

# The state guard extracted from `zk-ssl-guardian`: monotonic counter
# persisted with fsync, tmpfs self-check and reconciliation. Here it holds
# the checkpoint number (persist BEFORE signing) and, if the CA's cosigner
# is XMSS/LMS, the signature index. Pinned to a commit.
hbs-state = { git = "https://github.com/atoranzo/hbs-state", rev = "a960828bf0e810c30b49640c9bcb8d64f9c9557f" }

# ML-DSA (FIPS 204). The draft designs the cosignature format to be
# compatible with the ML-DSA-44 construction of TLOG-COSIGNATURE. Optional:
# the tree core does not depend on any concrete signature.
# ⚠️ No independent audit, as declared by the crate itself.
ml-dsa = { version = "0.1.1", optional = true }
# The salt of hedged ML-DSA signatures (FIPS 204, recommended variant) and
# the erasure of the seed: only with the `ml-dsa` feature.
getrandom = { version = "0.4", optional = true }
zeroize = { version = "1", optional = true }

[features]
default = ["ml-dsa"]
ml-dsa = ["dep:ml-dsa", "ml-dsa/zeroize", "dep:getrandom", "dep:zeroize"]

# The example signs with ML-DSA: without the feature it does not compile,
# and that is declared.
[[example]]
name = "demo_ca"
required-features = ["ml-dsa"]
